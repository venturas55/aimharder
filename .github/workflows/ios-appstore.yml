
name: AimHarder iOS - App Store Connect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aimharder-appstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Build IPA App Store
    runs-on: macos-26
    timeout-minutes: 120

    defaults:
      run:
        shell: bash
        working-directory: mobile

    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_GIT_STATUS: '1'
      RCT_USE_RN_DEP: '0'
      RCT_USE_PREBUILT_RNCORE: '0'
      APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify configuration
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f app.json
          test -f scripts/verify_expo_config.py

          : "${APPLE_BUNDLE_ID:?Missing APPLE_BUNDLE_ID}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          : "${EXPO_PUBLIC_API_URL:?Missing EXPO_PUBLIC_API_URL}"
          : "${IOS_P12_BASE64:?Missing IOS_P12_BASE64}"
          : "${IOS_P12_PASSWORD:?Missing IOS_P12_PASSWORD}"
          : "${IOS_APPSTORE_PROFILE_BASE64:?Missing IOS_APPSTORE_PROFILE_BASE64}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Select Xcode
        run: |
          XCODE_APP="/Applications/Xcode_26.6.app"
          if [ -d "$XCODE_APP/Contents/Developer" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Configure Expo
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          path = Path("app.json")
          config = json.loads(path.read_text())
          config["expo"].setdefault("ios", {})["bundleIdentifier"] = os.environ["APPLE_BUNDLE_ID"]

          # Unique build number for App Store Connect
          config["expo"]["ios"]["buildNumber"] = os.environ["GITHUB_RUN_NUMBER"]

          path.write_text(json.dumps(config, indent=2) + "\n")
          PY

      - name: Verify Expo config
        run: |
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          python3 scripts/verify_expo_config.py "$RUNNER_TEMP/expo-config.json"

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install CocoaPods
        run: |
          set -euo pipefail
          gem install cocoapods --version 1.16.2 --no-document
          cd ios
          pod install --repo-update 2>&1 | tee "$RUNNER_TEMP/aimharder-pods.log"

      - name: Install distribution certificate and profile
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/aimharder-appstore.keychain-db"
          P12="$RUNNER_TEMP/aimharder-dist.p12"
          PROFILE="$RUNNER_TEMP/aimharder-appstore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/aimharder-profile.plist"

          echo "$IOS_P12_BASE64" | base64 --decode > "$P12"
          echo "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$PROFILE"

          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"

          security import "$P12" \
            -k "$KEYCHAIN" \
            -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$RUNNER_TEMP" "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"

          security find-identity -v -p codesigning "$KEYCHAIN"

          security cms -D -i "$PROFILE" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$PROFILE_PLIST")
          PROFILE_APP=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$PROFILE_PLIST")

          test "$PROFILE_TEAM" = "$APPLE_TEAM_ID"
          test "$PROFILE_APP" = "$APPLE_TEAM_ID.$APPLE_BUNDLE_ID"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "Profile: $PROFILE_NAME"
          echo "Bundle ID: $APPLE_BUNDLE_ID"

          rm -f "$P12"

      - name: Configure native signing
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = Dir['ios/*.xcodeproj'].first
          abort 'Xcode project not found' unless project_path

          project = Xcodeproj::Project.open(project_path)

          targets = project.targets.select do |target|
            target.respond_to?(:product_type) &&
              target.product_type == 'com.apple.product-type.application'
          end

          abort 'Expected one iOS app target' unless targets.size == 1

          target = targets.first

          target.build_configurations.each do |config|
            next unless config.name == 'Release'

            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_UUID')
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('APPLE_BUNDLE_ID')
          end

          project.save

          File.write(ENV.fetch('RUNNER_TEMP') + '/app-scheme.txt', target.name)
          puts "Configured App Store signing for #{target.name}"
          RUBY

      - name: Archive iOS application
        run: |
          set -euo pipefail

          SCHEME=$(cat "$RUNNER_TEMP/app-scheme.txt")
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)

          test -n "$WORKSPACE"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AimHarderArchive.xcarchive" \
            archive \
            2>&1 | tee "$RUNNER_TEMP/aimharder-archive.log"

      - name: Create App Store export options
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {
                  os.environ["APPLE_BUNDLE_ID"]: os.environ["PROFILE_UUID"]
              },
              "manageAppVersionAndBuildNumber": False
          }

          path = Path(os.environ["RUNNER_TEMP"]) / "aimharder-export-options.plist"
          with path.open("wb") as file:
              plistlib.dump(options, file)
          PY

      - name: Export App Store IPA
        run: |
          set -euo pipefail
          mkdir -p output

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AimHarderArchive.xcarchive" \
            -exportPath "$PWD/output" \
            -exportOptionsPlist "$RUNNER_TEMP/aimharder-export-options.plist" \
            2>&1 | tee "$RUNNER_TEMP/aimharder-export.log"

          ls -lh output/*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimharder-appstore-${{ github.run_number }}
          path: mobile/output/*.ipa
          if-no-files-found: error
          retention-days: 14


      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: mobile/output/AimHarder.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'true'


      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aimharder-appstore-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/aimharder-archive.log
            ${{ runner.temp }}/aimharder-export.log
            ${{ runner.temp }}/aimharder-pods.log
            ${{ runner.temp }}/AimHarderArchive.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup signing
        if: always()
        run: |
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi

          security delete-keychain "$RUNNER_TEMP/aimharder-appstore.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/aimharder-dist.p12"
          rm -f "$RUNNER_TEMP/aimharder-appstore.mobileprovision"
          rm -f "$RUNNER_TEMP/aimharder-profile.plist"
